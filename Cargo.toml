[package]
name = "pg_ask"
version = "0.5.5"
edition = "2021"
rust-version = "1.82"
# ^ Minimum Supported Rust Version. pgrx 0.18 requires 1.82+.
# Operators building from source must have at least this toolchain.
license = "PostgreSQL"
description = "PostgreSQL extension that turns natural language questions into agent-driven SQL — ask your database in English (or any language)."
repository = "https://github.com/sentirum/pg_ask"
readme = "README.md"
keywords = ["postgres", "postgresql", "ai", "llm", "agent"]
categories = ["database"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["pg18"]
pg14 = ["pgrx/pg14", "pgrx-tests/pg14"]
pg15 = ["pgrx/pg15", "pgrx-tests/pg15"]
pg16 = ["pgrx/pg16", "pgrx-tests/pg16"]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17"]
pg18 = ["pgrx/pg18", "pgrx-tests/pg18"]
pg_test = []

[dependencies]
pgrx = "=0.18.1"
serde = { version = "1", features = ["derive"] }
# `preserve_order` keeps JSON object key order during deserialization,
# which we rely on in `tools::render::row_to_json` to preserve column
# order when rendering query results to the model.
serde_json = { version = "1", features = ["preserve_order"] }
# Blocking HTTP — pgrx fonksiyonları sync; PG backend tek thread, async runtime istemiyoruz.
# ureq 3.x has a redesigned API (typestate builder, body iter, error
# variants); the wrapper in src/infra/http.rs hides the migration from
# the rest of the crate. We pin to 3 and pull in `json` for serde
# integration; `rustls` is the default TLS provider as of 3.x and
# matches what we had in 2.x (no native-tls in either build).
ureq = { version = "3", features = ["json", "rustls"] }
# `url` powers host-based allow-list parsing in tools::http_fetch (C5
# SSRF fix). We need real RFC 3986 parsing rather than `starts_with`
# string matching, which previously let `api.openai.com.evil.com` slip
# past a `https://api.openai.com` allow entry.
url = "2"
thiserror = "2"
# Real SQL parser for sql_guard (v0.5). Replaces the token-based matcher
# for statement-type classification while keeping the lexer for function
# denylist checks.
# `visitor` feature unlocks the Visit / Visitor traits used by
# sql_guard::secrets_visitor to walk the AST (C8 v0.5.2 review). Without
# it the deny-list could only check statement type, not nested function
# calls or relation references.
sqlparser = { version = "0.62", features = ["visitor"] }

[dev-dependencies]
pgrx-tests = "=0.18.1"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1
