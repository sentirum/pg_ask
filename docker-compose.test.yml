# pg_ask integration test environment.
#
# Usage (from project root):
#   docker compose -f docker-compose.test.yml up --build -d
#   docker compose -f docker-compose.test.yml exec pg pg_isready
#
# Run fixture-based tests (no API key needed):
#   ./tests/run-fixture-tests.sh
#
# Run live provider E2E tests (API key required):
#   PG_ASK_API_KEY=sk-... PG_ASK_PROVIDER=anthropic ./tests/run-e2e-tests.sh
#
# Teardown:
#   docker compose -f docker-compose.test.yml down -v

services:
  pg:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PG_MAJOR: "18"
        PGRX_VERSION: "0.18.1"
    image: pg_ask:test-pg18
    container_name: pg_ask_test
    environment:
      POSTGRES_PASSWORD: test
      POSTGRES_DB: pg_ask_test
      POSTGRES_USER: postgres
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pg_ask_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - ./tests/sql:/tests:ro
