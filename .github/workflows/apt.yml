name: APT

# Build .deb packages for every supported (distro × arch) combination
# and publish them to Cloudsmith's OSS-hosted apt repo (sentirum/pg_ask).
#
# NOTE: the legacy gh-pages/reprepro apt repo (sentirum.github.io/pg_ask)
# was retired — Cloudsmith is now the single source for all formats
# (deb/rpm/apk/docker). Cloudsmith manages signing + index generation
# server-side, so none of the GPG/reprepro machinery is needed here.
#
# Pipeline:
#
#   build (matrix 4 distros × 2 archs = 8 jobs)
#                │
#                ▼
#         publish (1 job)
#           ├─ download all .deb artefacts
#           └─ cloudsmith push deb → sentirum/pg_ask/<debian|ubuntu>/<codename>
#
# Triggered by tag pushes (matches release.yml / docker.yml) and by
# workflow_dispatch so we can rebuild for an existing tag from the
# Actions UI. apt.yml is one leg of the v* tag fan-out alongside
# release.yml (tarball), docker.yml, rpm.yml, and apk.yml.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.5.3)"
        required: true
        default: "v0.5.3"

env:
  PG_MAJOR: "18"
  PGRX_VERSION: "=0.18.1"

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────
  # 8-way matrix. Each job runs inside a distro-specific
  # container so the resulting .deb links against the
  # distro's libc/libssl/libpq versions — critical for a
  # PG extension where the .so is dlopened by the system
  # postgres binary.
  #
  # arm64 jobs use the native ubuntu-24.04-arm runner
  # (same fix we applied in docker.yml); the container
  # then provides the Debian/Ubuntu userspace on top of
  # that arm64 kernel.
  # ─────────────────────────────────────────────────────
  build:
    name: Build ${{ matrix.codename }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Debian 12 (bookworm)
          - codename: bookworm
            image:    debian:12
            arch:     amd64
            runner:   ubuntu-24.04
          - codename: bookworm
            image:    debian:12
            arch:     arm64
            runner:   ubuntu-24.04-arm

          # Debian 13 (trixie)
          - codename: trixie
            image:    debian:13
            arch:     amd64
            runner:   ubuntu-24.04
          - codename: trixie
            image:    debian:13
            arch:     arm64
            runner:   ubuntu-24.04-arm

          # Ubuntu 22.04 (jammy)
          - codename: jammy
            image:    ubuntu:22.04
            arch:     amd64
            runner:   ubuntu-24.04
          - codename: jammy
            image:    ubuntu:22.04
            arch:     arm64
            runner:   ubuntu-24.04-arm

          # Ubuntu 24.04 (noble)
          - codename: noble
            image:    ubuntu:24.04
            arch:     amd64
            runner:   ubuntu-24.04
          - codename: noble
            image:    ubuntu:24.04
            arch:     arm64
            runner:   ubuntu-24.04-arm

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      # The container image starts essentially empty; install just
      # what we need to clone, set up Rust+pgrx, and build a .deb.
      # ca-certificates is the same gotcha we hit in the Dockerfile.
      - name: System build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl gnupg lsb-release sudo \
            git build-essential pkg-config \
            libclang-dev clang \
            fakeroot dpkg-dev

      # PGDG repo for postgresql-${PG_MAJOR} on every codename
      # (each LTS only ships its native major in the default repos;
      # PGDG is the universal source).
      - name: Add PGDG repo
        run: |
          install -d /usr/share/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            > /etc/apt/sources.list.d/pgdg.list
          apt-get update
          apt-get install -y --no-install-recommends \
            postgresql-${{ env.PG_MAJOR }} \
            postgresql-server-dev-${{ env.PG_MAJOR }}
          # Stop the auto-started cluster — we only need pg_config /
          # headers. Leaving it running can race with subsequent apt
          # operations inside the container.
          service postgresql stop || true

      # Rust + cargo-pgrx. We pin pgrx to match Cargo.toml.
      - uses: actions/checkout@v5

      - name: Install Rust stable
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache cargo registry + target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: apt-${{ matrix.codename }}-${{ matrix.arch }}-${{ env.PGRX_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            apt-${{ matrix.codename }}-${{ matrix.arch }}-${{ env.PGRX_VERSION }}-

      - name: Install cargo-pgrx
        run: |
          cargo install cargo-pgrx --locked --version ${{ env.PGRX_VERSION }}
          cargo pgrx init --pg${{ env.PG_MAJOR }} \
            /usr/lib/postgresql/${{ env.PG_MAJOR }}/bin/pg_config

      # Derive VERSION from the tag (or workflow_dispatch input). The
      # same shape as docker.yml so all three release legs stay in
      # lockstep.
      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VER="${TAG#v}"
          echo "tag=$TAG"     >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Build .deb
        env:
          VERSION:  ${{ steps.version.outputs.version }}
          PG_MAJOR: ${{ env.PG_MAJOR }}
          DISTRO:   ${{ matrix.codename }}
          ARCH:     ${{ matrix.arch }}
        run: |
          chmod +x packaging/debian/build-deb.sh
          packaging/debian/build-deb.sh

      - name: Upload .deb artefact
        uses: actions/upload-artifact@v5
        with:
          name: deb-${{ matrix.codename }}-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 7

  # ────────────────────────────────────────────
  # Push every .deb artefact to Cloudsmith. Cloudsmith
  # handles GPG signing + apt index generation server-side,
  # so this job is just: download → cloudsmith push deb.
  # ────────────────────────────────────────────
  publish:
    name: Publish to Cloudsmith
    runs-on: ubuntu-24.04
    needs: build

    steps:
      - name: Download all .deb artefacts
        uses: actions/download-artifact@v5
        with:
          path: incoming
          pattern: deb-*
          merge-multiple: true

      - name: List downloaded .debs
        run: |
          echo "Found $(ls incoming/*.deb | wc -l) .deb files:"
          ls -la incoming/

      - name: Install Cloudsmith CLI
        run: pipx install cloudsmith-cli

      - name: Push .debs to Cloudsmith
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_TOKEN }}
        run: |
          repo=sentirum/pg_ask
          for deb in incoming/*.deb; do
            base=$(basename "$deb")
            # Codename lives between "+" and the next "_", e.g.
            # ..._0.5.6-1+bookworm_amd64.deb -> bookworm.
            codename=$(echo "$base" | sed -E 's/.*\+([a-z]+)_.*/\1/')
            case "$codename" in
              bookworm|trixie)  distro=debian ;;
              jammy|noble)      distro=ubuntu ;;
              *) echo "::error::unknown codename '$codename' for $base"; exit 1 ;;
            esac
            target="$repo/$distro/$codename"
            echo "==> cloudsmith push deb $target $base"
            # Idempotency: re-running a publish for an already-uploaded
            # version makes Cloudsmith return a 422 "already exists"
            # conflict. Tolerate that so re-runs don't fail the job, while
            # still failing on any other (real) error.
            out=$(cloudsmith push deb --no-wait-for-sync "$target" "$deb" 2>&1) || {
              if echo "$out" | grep -qiE 'already exists|conflict|duplicate'; then
                echo "$out"
                echo "==> skip $base (already on Cloudsmith)"
                continue
              fi
              echo "$out"
              echo "::error::cloudsmith push failed for $base"
              exit 1
            }
            echo "$out"
          done
