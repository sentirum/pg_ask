name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  PGRX_VERSION: "=0.18.0"    # keep in sync with Cargo.toml

jobs:
  # ─────────────────────────────────────────────────────
  # Lint + full test suite (lib + pg_test). The 11
  # `#[pg_test]` items need a live PG cluster, so we use
  # `cargo pgrx test pg18` (which boots its own user-
  # owned cluster) instead of `cargo test --lib` (which
  # would try to write into /usr/share/postgresql and
  # fail with EACCES).
  # ─────────────────────────────────────────────────────
  lint-and-test:
    name: Lint + Unit tests (pg18, Linux x86_64)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo registry + build artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.pgrx
            target/
          # pgrx version is part of the key so a bump invalidates the
          # pgrx data dir (which is tied to a specific PG layout).
          key: ${{ runner.os }}-cargo-${{ env.PGRX_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-${{ env.PGRX_VERSION }}-

      # PG18 server headers + pg_config for pgrx FFI generation. We
      # do NOT install postgresql-18 itself — pgrx provides its own
      # user-owned cluster under ~/.pgrx so `cargo pgrx test` has
      # somewhere to write the extension files.
      - name: Add PGDG apt repository
        run: |
          sudo apt-get install -y curl gnupg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/postgresql-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql-keyring.gpg] \
            https://apt.postgresql.org/pub/repos/apt noble-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update

      - name: Install PG18 dev headers + build deps
        run: |
          sudo apt-get install -y \
            postgresql-server-dev-18 \
            libclang-dev clang pkg-config

      - name: Cache cargo-pgrx binary
        id: cache-pgrx-bin
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-pgrx
          key: ${{ runner.os }}-cargo-pgrx-${{ env.PGRX_VERSION }}

      - name: Install cargo-pgrx
        if: steps.cache-pgrx-bin.outputs.cache-hit != 'true'
        run: cargo install cargo-pgrx --locked --version ${{ env.PGRX_VERSION }}

      # Use the SYSTEM pg_config (from postgresql-server-dev-18) for
      # header layout, but tell pgrx to create its OWN cluster under
      # ~/.pgrx — this is what makes `cargo pgrx test` work without
      # root. Without this pgrx-test would try to install the
      # extension into /usr/share/postgresql and fail with EACCES.
      - name: Initialise pgrx (own cluster under ~/.pgrx)
        run: cargo pgrx init --pg18 download

      - name: rustfmt check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: |
          cargo clippy \
            --no-default-features --features pg18 \
            -- -D warnings

      # `cargo pgrx test` boots its private pg18 cluster, installs the
      # extension into it, and runs every `#[pg_test]` plus every
      # `#[test]` together. Same 75/75 set we see locally.
      - name: Run full test suite (cargo pgrx test pg18)
        run: |
          cargo pgrx test pg18 \
            --no-default-features --features pg18
