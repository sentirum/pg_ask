name: Release

on:
  push:
    tags:
      - "v*"           # triggers on v0.5.2, v0.6.0, …
  workflow_dispatch:   # manual trigger from the Actions UI
    inputs:
      tag:
        description: "Tag to release (e.g. v0.5.2)"
        required: true
        default: "v0.5.2"

permissions:
  contents: write      # needed to create GitHub releases

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # needed for git describe / tag listing

      # ── Extract version from tag ─────────────────────
      - name: Set version env
        id: version
        run: |
          # On tag push GITHUB_REF_NAME is the tag (v0.5.2).
          # On workflow_dispatch the user provides the tag explicitly.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VER="${TAG#v}"
          echo "tag=$TAG"     >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      # ── Extract release notes from CHANGELOG.md ──────
      #    Grabs everything between the ## [X.Y.Z] heading
      #    for this release and the next ## [ heading.
      - name: Extract release notes
        id: notes
        run: |
          VER="${{ steps.version.outputs.version }}"
          # awk: print lines between the version heading
          # (inclusive) and the next ## [ heading (exclusive).
          NOTES=$(awk \
            "/^## \[${VER//./\\.}\]/{found=1; next} \
             found && /^## \[/{exit} \
             found{print}" \
            CHANGELOG.md)
          # GitHub's multiline output encoding
          {
            echo 'notes<<CHANGELOG_BODY'
            echo "$NOTES"
            echo 'CHANGELOG_BODY'
          } >> "$GITHUB_OUTPUT"

      # ── Build release artefact (Linux, statically linked deps) ──
      #    We ship the source-only tarball via GitHub's automatic
      #    zip/tar.gz on the release; a separate pre-built .so for
      #    Linux x86_64 is produced here so users can drop it in
      #    without a full Rust toolchain.
      - name: Add PGDG + install PG18 dev headers
        run: |
          sudo apt-get install -y curl gnupg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/postgresql-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql-keyring.gpg] \
            https://apt.postgresql.org/pub/repos/apt noble-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          # Need the full postgresql-18 package because it ships
          # the runtime tree (/usr/share/postgresql/18/extension,
          # /usr/lib/postgresql/18/lib) that pgrx install writes
          # into. Headers alone don't create those dirs. v0.5.3
          # dropped libssl-dev (ureq 3 = rustls).
          sudo apt-get install -y \
            postgresql-18 postgresql-server-dev-18 \
            libclang-dev clang pkg-config
          # Stop the system cluster; we don't need it for a build
          # and leaving it running can race with chown.
          sudo systemctl stop postgresql || true
          # Make the system extension + lib dirs writable so
          # `cargo pgrx install` can drop pg_ask.{control,sql,so}
          # into them without sudo. Throwaway runner makes this safe.
          sudo chown -R "$USER" \
            /usr/share/postgresql/18/extension \
            /usr/lib/postgresql/18/lib

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-pgrx
        run: cargo install cargo-pgrx --locked --version =0.18.1

      - name: Initialise pgrx (system PG18)
        run: cargo pgrx init --pg18 /usr/lib/postgresql/18/bin/pg_config

      # Install into a staging dir so we can bundle a clean tarball.
      # cargo pgrx install writes directly to the pg_config-reported
      # paths (which we made writable for the runner user above);
      # we then copy the artefacts into a release staging tree and
      # tar it up.
      - name: Build + stage extension files
        id: build
        run: |
          STAGING="staging/pg_ask-${{ steps.version.outputs.version }}-pg18-linux-x86_64"
          mkdir -p "$STAGING"/{lib,extension}

          # cargo pgrx install in 0.18 takes --pg-config positionally
          # as PATH to pg_config; the system PG18 install puts
          # pg_config at /usr/lib/postgresql/18/bin.
          cargo pgrx install \
            --release \
            --no-default-features --features pg18 \
            --pg-config /usr/lib/postgresql/18/bin/pg_config

          PG_CONFIG=/usr/lib/postgresql/18/bin/pg_config
          PKGLIBDIR=$($PG_CONFIG --pkglibdir)
          SHAREDIR=$($PG_CONFIG --sharedir)

          cp "$PKGLIBDIR/pg_ask.so"                      "$STAGING/lib/"
          cp "$SHAREDIR/extension/pg_ask.control"        "$STAGING/extension/"
          cp "$SHAREDIR/extension/pg_ask"*.sql           "$STAGING/extension/"
          # Also bundle the handwritten upgrade scripts so an
          # operator who already has an older version can step
          # through.
          cp sql/pg_ask--0.5.1--0.5.2.sql                "$STAGING/extension/" 2>/dev/null || true
          cp sql/pg_ask--0.5.2--0.5.3.sql                "$STAGING/extension/" 2>/dev/null || true

          # README + CHANGELOG for the bundle
          cp README.md CHANGELOG.md LICENSE "$STAGING/"

          # Package
          ARCHIVE="$STAGING.tar.gz"
          tar -czf "$ARCHIVE" -C staging "$(basename "$STAGING")"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      # ── Create GitHub Release ────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "pg_ask ${{ steps.version.outputs.tag }}"
          body: |
            ## pg_ask ${{ steps.version.outputs.tag }}

            ${{ steps.notes.outputs.notes }}

            ---

            ### Install (pre-built, Linux x86_64 + PG18)

            Download the tarball below and run:

            ```bash
            tar xzf pg_ask-${{ steps.version.outputs.version }}-pg18-linux-x86_64.tar.gz
            cd pg_ask-${{ steps.version.outputs.version }}-pg18-linux-x86_64
            # as the postgres user:
            cp lib/pg_ask.so      $(pg_config --pkglibdir)/
            cp extension/*        $(pg_config --sharedir)/extension/
            ```

            Then in psql:

            ```sql
            CREATE EXTENSION pg_ask;
            ```

            ### Docker

            ```bash
            docker pull ghcr.io/sentirum/pg_ask:${{ steps.version.outputs.version }}-pg18
            ```

            See [README.md](https://github.com/sentirum/pg_ask#readme) for full setup.
          files: ${{ steps.build.outputs.archive }}
          draft: false
          prerelease: false
