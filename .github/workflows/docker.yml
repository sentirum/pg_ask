name: Docker

on:
  push:
    tags:
      - "v*"           # triggers on v0.5.2, v0.6.0, …
  workflow_dispatch:   # manual re-run from the Actions UI
    inputs:
      tag:
        description: "Tag to build (e.g. v0.5.3)"
        required: true
        default: "v0.5.3"

env:
  REGISTRY: ghcr.io
  IMAGE:    ghcr.io/sentirum/pg_ask
  # Parallel publishing target: Cloudsmith's OSS-hosted Docker
  # registry. Each Cloudsmith repo is its own registry namespace
  # (docker.cloudsmith.io/OWNER/REPO), and the image name becomes
  # the final path segment. This runs alongside the GHCR push;
  # neither depends on the other so we can migrate at our own pace.
  CS_REGISTRY: docker.cloudsmith.io
  CS_IMAGE:    docker.cloudsmith.io/sentirum/pg_ask/pg_ask

permissions:
  contents: read
  packages: write      # needed to push to GHCR

# ──────────────────────────────────────────────────────────
# Multi-arch strategy: NATIVE runners per platform, no QEMU.
#
# Earlier versions of this workflow built linux/amd64 and
# linux/arm64 in one job via `docker buildx build --platform
# linux/amd64,linux/arm64`. arm64 went through QEMU emulation
# on the x86_64 runner; cargo compiling pgrx + ring + rustls
# under QEMU took ~2h and routinely hit GH Actions' 6h limit.
#
# GitHub (Jan 2025+) gives public repos free `ubuntu-24.04-arm`
# native arm64 runners with the same pricing as x86_64. The
# matrix below uses each platform's native runner so each build
# takes the same ~5–10 min as the local x86_64 path used to.
#
# Pipeline:
#
#   build (matrix) ─┬─ amd64 on ubuntu-24.04         ─► digest
#                   └─ arm64 on ubuntu-24.04-arm     ─► digest
#                              │
#                              ▼
#                       merge (manifest list)
#                              │
#                              ▼
#         ghcr.io/sentirum/pg_ask:{VERSION-pgNN,latest-pgNN}  (NN=16/17/18)
#
# Each build job pushes a digest-only image (no tag). The merge
# job then assembles the per-platform digests into a multi-arch
# manifest under the human-readable tags. This is the pattern
# docker/build-push-action's own README recommends for native
# multi-arch.
# ──────────────────────────────────────────────────────────

jobs:
  build:
    name: Build pg${{ matrix.pg_major }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}

    # {PG 16,17,18} × {amd64,arm64} = 6 per-platform digest builds.
    # The merge job then assembles one multi-arch manifest per PG major.
    strategy:
      fail-fast: false
      matrix:
        pg_major: ["16", "17", "18"]
        include:
          - platform: linux/amd64
            runner:   ubuntu-24.04
            arch:     amd64
          - platform: linux/arm64
            runner:   ubuntu-24.04-arm
            arch:     arm64

    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Per-platform build, digest-only push (no tag yet). The
      # manifest assembly happens in the `merge` job once both
      # arch builds have completed. Cache is keyed per-arch so
      # the two builds don't trash each other's layer cache.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # `outputs: type=image,push-by-digest=true` makes
          # buildx push the layers to GHCR but emit a manifest
          # digest instead of a tag. The merge step consumes
          # the digest via the metadata file.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-pg${{ matrix.pg_major }}-${{ matrix.arch }}
          cache-to:   type=registry,ref=${{ env.IMAGE }}:buildcache-pg${{ matrix.pg_major }}-${{ matrix.arch }},mode=max
          build-args: |
            PG_MAJOR=${{ matrix.pg_major }}
            PGRX_VERSION=0.18.1

      # Stage the digest for the merge job. Using one file per
      # platform under a shared directory keeps the upload tidy
      # without baking platform names into the filename glob.
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          DIGEST="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v5
        with:
          name: digests-pg${{ matrix.pg_major }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Assemble pg${{ matrix.pg_major }} multi-arch manifest
    runs-on: ubuntu-24.04
    needs: build

    # One manifest-assembly job per PG major; each stitches that
    # major's amd64+arm64 digests into a multi-arch image tagged
    # <version>-pg<major> and latest-pg<major>.
    strategy:
      fail-fast: false
      matrix:
        pg_major: ["16", "17", "18"]

    steps:
      - uses: actions/checkout@v5

      # ── Meta (same source of truth as the build) ─────
      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VER="${TAG#v}"
          echo "tag=$TAG"     >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}-pg${{ matrix.pg_major }}
            type=raw,value=latest-pg${{ matrix.pg_major }}
          labels: |
            org.opencontainers.image.title=pg_ask
            org.opencontainers.image.description=Ask your PostgreSQL database in natural language
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.licenses=PostgreSQL

      # Only this PG major's digests (both arches) — the pattern is
      # scoped so we don't mix majors into one manifest.
      - name: Download digests
        uses: actions/download-artifact@v5
        with:
          path: /tmp/digests
          pattern: digests-pg${{ matrix.pg_major }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `buildx imagetools create` reads the digest files we
      # uploaded (one per platform) and stitches them into a
      # single manifest list, then pushes it under every tag
      # the metadata-action computed.
      - name: Create + push manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' \
                  <<<'${{ steps.meta.outputs.json }}') \
            $(printf "${{ env.IMAGE }}@sha256:%s " *)

      - name: Inspect manifest
        run: |
          docker buildx imagetools inspect \
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}-pg${{ matrix.pg_major }}

      # ── Cloudsmith (parallel target) ─────────────────
      # Log in to Cloudsmith's Docker registry. For PUSH, the username
      # is the Cloudsmith account username (NOT the OWNER/REPO slug —
      # that form is only for pull/entitlement tokens) and the password
      # is the Cloudsmith API key (the same CLOUDSMITH_TOKEN secret the
      # APT workflow uses).
      - name: Log in to Cloudsmith
        uses: docker/login-action@v3
        with:
          registry: ${{ env.CS_REGISTRY }}
          username: ersin-tarhan
          password: ${{ secrets.CLOUDSMITH_TOKEN }}

      # Re-stitch the same per-arch digests into a manifest list,
      # this time targeting Cloudsmith. `imagetools create` copies
      # the source blobs (still on GHCR) into the destination
      # registry, so this produces a self-contained multi-arch
      # image on Cloudsmith without rebuilding. We rewrite the
      # GHCR tags in the metadata JSON to point at CS_IMAGE.
      - name: Create + push manifest list to Cloudsmith
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr --arg img "${{ env.CS_IMAGE }}" \
                  '.tags | map("-t " + ($img + ":" + (split(":")[-1]))) | join(" ")' \
                  <<<'${{ steps.meta.outputs.json }}') \
            $(printf "${{ env.IMAGE }}@sha256:%s " *)

      - name: Inspect Cloudsmith manifest
        run: |
          docker buildx imagetools inspect \
            ${{ env.CS_IMAGE }}:${{ steps.version.outputs.version }}-pg${{ matrix.pg_major }}
